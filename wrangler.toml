name = "app-billing"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# JWT_SECRET: em dev local é lido de .dev.vars (não commitado).
# Em produção: wrangler secret put JWT_SECRET

# CORS: origens permitidas (separadas por vírgula). Para front na Cloudflare Pages, use a URL do projeto.
# Ex.: https://app-billing-ui.pages.dev ou https://seu-dominio.com
[vars]
CORS_ORIGINS = "http://localhost:3000"

[[d1_databases]]
binding = "DB"
database_name = "app-billing-db"
# Rode: npx wrangler d1 create app-billing-db  e cole o database_id abaixo para deploy remoto
database_id = "00000000-0000-0000-0000-000000000001"
